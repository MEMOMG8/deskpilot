[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskpilot"
version = "0.1.0"
description = "Local-first Windows desktop voice assistant backend foundation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "faster-whisper>=1.0",
    "openwakeword>=0.6.0",
    "PySide6>=6.6",
    "python-multipart>=0.0.9",
    "pyttsx3>=2.90",
    "sounddevice>=0.4.6",
    "uvicorn[standard]>=0.23",
]

[project.optional-dependencies]
dev = [
    "httpx2>=0.1",
    "pytest>=7.0",
]

[tool.setuptools.package-data]
deskpilot_backend = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
